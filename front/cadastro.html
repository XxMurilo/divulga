<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="CSS/cadastro.css">
</head>
<body>

    <header class="topo">
        <div class="logo">Seeds of Good</div>
        <div class="VoltarInicio">
            <button id="btnVoltar" onclick="window.location.href='telaInicial.html'">Voltar para o início</button>
        </div>
    </header>

    <div class="areaCadastro">
        <div class="cadastro">

            <h1>Cadastro</h1>

            <!-- action aponta para o PHP; method POST para não expor dados na URL -->
            <form action="PHP/cadastro.php" method="POST">

                <input type="text" name="nome" placeholder="Nome Completo" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="text" name="telefone" placeholder="Telefone" required>
                <input type="text" name="endereco" placeholder="Endereço" required>
                <input type="text" name="identificacao" placeholder="CPF ou CNPJ" required>

                <input type="password" name="senha" placeholder="Senha (mínimo 6 caracteres)" required>

                <select name="cidade" id="cidade">
                    <option value="Ribeirão Preto">Ribeirão Preto</option>
                    <option value="Sertãozinho">Sertãozinho</option>
                </select>

                <select name="tipoUsuario" id="tipoUsuario">
                    <option value="Doador">Doador</option>
                    <option value="Recebedor">Recebedor</option>
                    <option value="Administrador">Administrador</option>
                </select>

                <button id="btnCadastrar" type="submit">Cadastrar</button>

            </form>

        </div>
    </div>

</body>
</html>

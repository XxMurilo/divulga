<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" >
    <title>Cadastro</title>

    <link rel="stylesheet" href="CSS/cadastro.css">
</head>
<body>

    <header class="topo">
        <div class="logo">
             Seeds of Good
         </div>
        <div class="VoltarInicio">
            <button id="btnVoltar" onclick="window.location.href='telaInicial.html'">Voltar para o início</button>
        </div>
    </header>

    <div></div>

    <div class="areaCadastro">

        <div class="cadastro">

            <h1>Cadastro</h1>

            <form>

                <input type="text" placeholder="Nome Completo" required>

                <input type="email" placeholder="Email" required>

                <input type="text" placeholder="Telefone" required>

                <input type="text" placeholder="Endereço" required>

                <input type="text" placeholder="CPF ou CNPJ" required>

                <input type="text" placeholder="Autentificação" required>

                <input type="password" placeholder="Senha" required>

                <select name="cidade" id="cidade">
                    <option>Ribeirão Preto</option>
                    <option>Sertãozinho</option>
                </select>

                <select name="tipoUsuario" id="tipoUsuario">
                    <option>Doador</option>
                    <option>Recebedor</option>
                    <option>Administrador</option>
                </select>

                <button id="btnCadastrar" type="submit">Cadastrar</button>

            </form>

        </div>

    </div>

</body>
</html>

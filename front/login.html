<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area de login</title>
</head>
<body>
    <header class="topo">
        <div class="logo">
            Divulgando Perecível
        </div>
    </header>

    <div class="areaLogin">

        <div class="login">

            <h1>Cadastro</h1>

            <form>

                <input type="text" placeholder="Nome Completo">

                <input type="email" placeholder="Email">

                <input type="text" placeholder="Telefone">

                <input type="text" placeholder="Endereço">

                <input type="text" placeholder="CPF ou CNPJ">

                <input type="text" placeholder="Autentificação">

                <select>
                    <option>Cidade</option>
                    <option>Ribeirão Preto</option>
                    <option>Sertãozinho</option>
                </select>

                <select>
                    <option>Tipo de Usuário</option>
                    <option>Doador</option>
                    <option>Recebedor</option>
                    <option>Administrador</option>
                </select>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </div>

    </div>
    
</body>
</html>

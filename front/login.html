<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area de login</title>
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="CSS/cadastro.css">
</head>
<body>
    <header class="topo">
        <div class="logo">
            Divulgando Perecível
        </div>
        <div class="VoltarInicio">
            <button id="btnVoltar" onclick="window.location.href='telaInicial.html'">Voltar para o início</button>
        </div>
    </header>

    <div class="areaLogin">

        <div class="login">

            <h1>Login</h1>

            <form>

                <input type="email" placeholder="Email" required>

                <input type="text" placeholder="CPF ou CNPJ" required>

                <input type="password" placeholder="Senha" required>

                <select name="tipoUsuario" id="tipoUsuario">
                    <option>Doador</option>
                    <option>Recebedor</option>
                    <option>Administrador</option>
                </select>

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>
    
</body>
</html>

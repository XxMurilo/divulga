<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Seeds of Good</title>
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="CSS/cadastro.css">
</head>
<body>
    <header class="topo">
        <div class="logo">Seeds of Good</div>
        <div class="VoltarInicio">
            <button id="btnVoltar" onclick="window.location.href='telaInicial.html'">Voltar para o início</button>
        </div>
    </header>

    <div class="areaLogin">
        <div class="login">

            <h1>Login</h1>

            <form action="PHP/login.php" method="POST">

                <input type="email"    name="email"         placeholder="Email" required>

                <input type="text"     name="identificacao" placeholder="CPF ou CNPJ" required>

                <input type="password" name="senha"         placeholder="Senha" required>

                <select name="tipoUsuario" id="tipoUsuario">
                    <option value="Doador">Doador</option>
                    <option value="Recebedor">Recebedor</option>
                    <option value="Administrador">Administrador</option>
                </select>

                <button type="submit">Login</button>

            </form>

        </div>
    </div>

</body>
</html>

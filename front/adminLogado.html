<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeds of Good — Administrador</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/adminLogado.css">
</head>

<body>
    <!-- HEADER -->
    <header class="topo">
        
        <div class="logo">
            <img src="../assets/img/LogoTCC_Transparente.png" alt="Logo Seeds of Good">
            Seeds of Good
        </div>

        <nav>
            <ul>
                <li><a href="#" class="nav-link ativo" data-secao="tabelas">Home</a></li>
                <li><a href="#" class="nav-link" data-secao="conta">Minha Conta</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN -->
    <main id="secao-tabelas" class="secao ativa">
        <!-- Search Bar -->
        <section class="procura">
            <input id="search" type="text" placeholder="Pesquisar">
        </section>

        <!-- Tables Tab -->
        <section class='tablesTab'>
            <button type="button" class="aba" data-table="food">Alimentos Disponíveis</button>
            <button type="button" class="aba" data-table="user">Usuários</button>
            <button type="button" class="aba" data-table="complaint">Denúncia</button>
            <button type="button" class="aba" data-table="reserved">Alimentos Reservados</button>
        </section>

        <section id="TableView"></section>

    </main>

    <!-- SEÇÃO: MINHA CONTA -->
    <main id="secao-conta" class="secao">
        <h2 class="secao-titulo">Minha Conta</h2>
        <p class="secao-subtitulo">Gerencie suas informações pessoais.</p>
        <p id="mensagemConta" class="msg-status"></p>
        <div class="conta-wrapper">

            <!-- Visualização -->
            <div class="conta-card" id="cardVisualizacao">
                <div class="conta-avatar" id="avatarInicial">?</div>
                <div class="conta-dados" id="dadosConta">
                    <p class="carregando-conta">Carregando dados...</p>
                </div>
                <div class="conta-acoes">
                    <button class="btn-editar-conta" id="btnEditarConta">✏️ Editar dados</button>
                    <button class="btn-sair" id="btnSair">← Sair da conta</button>
                </div>
            </div>

            <!-- Edição -->
            <div class="conta-card conta-form" id="cardEdicao" style="display:none">
                <h3 class="form-titulo">Editar Dados</h3>
                <div class="campo">
                    <label>Nome completo</label>
                    <input type="text" id="editNome" placeholder="Seu nome" maxlength="100">
                </div>
                <div class="campo">
                    <label>E-mail</label>
                    <input type="email" id="editEmail" placeholder="seu@email.com" maxlength="255">
                </div>
                <div class="campo">
                    <label>Telefone</label>
                    <input type="text" id="editTelefone" placeholder="(11) 99999-9999" maxlength="30">
                </div>
                <div class="campo">
                    <label>Endereço</label>
                    <input type="text" id="editEndereco" placeholder="Rua, número, bairro" maxlength="150">
                </div>
                <div class="campo">
                    <label>Nova senha <span class="campo-opcional">(deixe em branco para manter a atual)</span></label>
                    <input type="password" id="editSenha" placeholder="••••••" maxlength="100">
                </div>
                <div class="campo">
                    <label>Confirmar nova senha</label>
                    <input type="password" id="editSenhaConfirm" placeholder="••••••" maxlength="100">
                </div>
                <div class="acoes-modal">
                    <button type="button" class="btn-cancelar" id="btnCancelarEdicao">Cancelar</button>
                    <button type="button" class="btn-salvar" id="btnSalvarConta">Salvar alterações</button>
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL CONFIRMAR SAÍDA -->
    <div class="overlay" id="overlayLogout">
        <div class="modal modal-pequeno">
            <h2>Sair da conta?</h2>
            <p class="modal-texto">Você será redirecionado para a tela inicial.</p>
            <div class="acoes-modal">
                <button class="btn-cancelar" id="btnCancelarLogout">Cancelar</button>
                <button class="btn-sair-confirmar" id="btnConfirmarLogout">Sair</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/admin.js"></script>
</body>

</html>

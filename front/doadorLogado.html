<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeds of Good — Doador</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/doadorLogado.css">
</head>
<body>

    <!-- HEADER -->
    <header class="topo">
        <div class="logo"> Seeds of Good</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Doações</a></li>
                <li><a href="#">Minha Conta</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <button class="btn-novo" onclick="abrirModal()">
             Cadastrar Novo Alimento
        </button>

        <h2 class="secao-titulo">Seus alimentos disponíveis</h2>

        <div id="listaAlimentos">
            <div class="lista-vazia" id="msgVazia">
                <span></span>
                Nenhum alimento cadastrado ainda.<br>Clique em "Cadastrar Novo Alimento" para começar.
            </div>
            <div class="lista" id="lista"></div>
        </div>
    </main>

    <!-- MODAL FORMULÁRIO -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <h2> Novo Alimento para Doação</h2>

            <div class="campo">
                <label>Tipo de Alimento</label>
                <select id="tipo">
                    <option value="">Selecione o tipo...</option>
                    <option>Fruta</option>
                    <option>Verdura</option>
                    <option>Legume</option>
                    <option>Grão / Cereal</option>
                    <option>Laticínio</option>
                    <option>Pão / Massa</option>
                    <option>Outro</option>
                </select>
            </div>

            <div class="campo">
                <label>Nome do Alimento</label>
                <input type="text" id="nome" placeholder="Ex: Banana, Arroz, Leite...">
            </div>

            <div class="campo">
                <label>Quantidade (unidades)</label>
                <input type="number" id="quantidade" min="1" placeholder="Ex: 10">
            </div>

            <div class="campo">
                <label>Descrição (peso/kg por unidade)</label>
                <textarea id="descricao" placeholder="Ex: Cada unidade equivale a aproximadamente 1 kg. Produto fechado e em bom estado."></textarea>
            </div>

            <div class="acoes-modal">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="btn-salvar" onclick="salvarAlimento()">Salvar</button>
            </div>
        </div>
    </div>

    <script src="JS/doador.js"></script>

</body>
</html>
